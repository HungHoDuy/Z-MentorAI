services:
  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    ports:
      - "8000:8080"
    env_file:
      - .env
    environment:
      - MCP_SERVER_URL=http://mcp-server:8080/sse
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    volumes:
      - ./orchestrator/users_db.json:/app/users_db.json
      - ./orchestrator/chat_history_db.json:/app/chat_history_db.json
    depends_on:
      - mcp-server

  mcp-server:
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    ports:
      - "8004:8080"
    environment:
      - PROFILE_SCANNER_URL=http://profile-scanner:8080
      - MARKET_SCOUT_URL=http://market-scout:8080
      - ACADEMIC_ARCHITECT_URL=http://academic-architect:8080
    depends_on:
      - profile-scanner
      - market-scout
      - academic-architect

  profile-scanner:
    build:
      context: ./profile_scanner
      dockerfile: Dockerfile
    ports:
      - "8001:8080"

  market-scout:
    build:
      context: ./market_scout
      dockerfile: Dockerfile
    ports:
      - "8002:8080"

  academic-architect:
    build:
      context: ./academic_architect
      dockerfile: Dockerfile
    ports:
      - "8003:8080"
    env_file:
      - .env
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
