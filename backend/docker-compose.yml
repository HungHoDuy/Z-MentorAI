services:
  orchestrator:
    build:
      context: ..
      dockerfile: backend/orchestrator/Dockerfile
    ports:
      - "8000:8080"
    env_file:
      - .env
    environment:
      - MCP_SERVER_URL=${MCP_SERVER_URL:-http://mcp-server:8080/sse}
      - PROFILE_SCANNER_URL=${PROFILE_SCANNER_URL:-http://profile-scanner:8080}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - USE_FIRESTORE=${USE_FIRESTORE:-false}
      - USE_VERTEX_AI=${USE_VERTEX_AI:-false}
      - FIRESTORE_DATABASE=${FIRESTORE_DATABASE:-(default)}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-z-mentorai}
    volumes:
      - ./orchestrator/users_db.json:/app/users_db.json
      - ./orchestrator/chat_history_db.json:/app/chat_history_db.json
      - ${GCLOUD_CONFIG_DIR:-./.gcloud}:/root/.config/gcloud:ro
    depends_on:
      - mcp-server

  mcp-server:
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    ports:
      - "8004:8080"
    env_file:
      - .env
    environment:
      - PROFILE_SCANNER_URL=${PROFILE_SCANNER_URL:-http://profile-scanner:8080}
      - MARKET_SCOUT_URL=${MARKET_SCOUT_URL:-http://market-scout:8080}
      - ACADEMIC_ARCHITECT_URL=${ACADEMIC_ARCHITECT_URL:-http://academic-architect:8080}
    depends_on:
      - profile-scanner
      - market-scout
      - academic-architect

  profile-scanner:
    build:
      context: ./profile_scanner
      dockerfile: Dockerfile
    ports:
      - "8001:8080"
    env_file:
      - .env
    environment:
      - USE_FIRESTORE=${USE_FIRESTORE:-false}
      - FIRESTORE_DATABASE=${FIRESTORE_DATABASE:-(default)}
      - HOLLAND_COLLECTION_NAME=${HOLLAND_COLLECTION_NAME:-profile_scanner_holland_assessments}
      - CV_STORAGE_BUCKET=${CV_STORAGE_BUCKET}
      - CV_DOCUMENTS_COLLECTION=${CV_DOCUMENTS_COLLECTION:-profile_scanner_cv_documents}
      - CV_MAX_FILE_SIZE_BYTES=${CV_MAX_FILE_SIZE_BYTES:-10485760}
      - HOLLAND_RESULTS_PATH=${HOLLAND_RESULTS_PATH:-/app/holland_results_db.json}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-z-mentorai}
      - DOCUMENT_AI_LOCATION=${DOCUMENT_AI_LOCATION:-us}
      - DOCUMENT_AI_PROCESSOR_ID=${DOCUMENT_AI_PROCESSOR_ID}
      - DOCUMENT_AI_PROCESSOR_NAME=${DOCUMENT_AI_PROCESSOR_NAME}
      - USE_VERTEX_AI=${USE_VERTEX_AI:-false}
      - VERTEX_AI_LOCATION=${VERTEX_AI_LOCATION:-asia-southeast1}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - PROFILE_AI_EXTRACTION_ENABLED=${PROFILE_AI_EXTRACTION_ENABLED:-false}
      - PROFILE_AI_MODEL_NAME=${PROFILE_AI_MODEL_NAME:-gemini-2.5-flash}
    volumes:
      - ${GCLOUD_CONFIG_DIR:-./.gcloud}:/root/.config/gcloud:ro

  market-scout:
    build:
      context: ./market_scout
      dockerfile: Dockerfile
    ports:
      - "8002:8080"

  academic-architect:
    build:
      context: ./academic_architect
      dockerfile: Dockerfile
    ports:
      - "8003:8080"
