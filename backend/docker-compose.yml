services:
  orchestrator:
    build:
      context: ..
      dockerfile: backend/orchestrator/Dockerfile
    ports:
      - "8000:8080"
    env_file:
      - .env
    environment:
      - MCP_SERVER_URL=${MCP_SERVER_URL:-http://mcp-server:8080/sse}
      - PROFILE_SCANNER_URL=${PROFILE_SCANNER_URL:-http://profile-scanner:8080}
      - USE_FIRESTORE=${USE_FIRESTORE:-false}
      - USE_VERTEX_AI=${USE_VERTEX_AI:-false}
      - FIRESTORE_DATABASE=${FIRESTORE_DATABASE:-(default)}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-z-mentorai}
    volumes:
      - ./orchestrator/users_db.json:/app/users_db.json
      - ./orchestrator/chat_history_db.json:/app/chat_history_db.json
      - ${GCLOUD_CONFIG_DIR:-./.gcloud}:/root/.config/gcloud:ro
    depends_on:
      - mcp-server

  mcp-server:
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    ports:
      - "8004:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
      - PROFILE_SCANNER_URL=${PROFILE_SCANNER_URL:-http://profile-scanner:8080}
      - PROFILE_SCANNER_SCAN_TIMEOUT_SECONDS=${PROFILE_SCANNER_SCAN_TIMEOUT_SECONDS:-540}
      - MARKET_SCOUT_URL=${MARKET_SCOUT_URL:-http://market-scout:8080}
      - ACADEMIC_ARCHITECT_URL=${ACADEMIC_ARCHITECT_URL:-http://academic-architect:8080}
    depends_on:
      - profile-scanner
      - market-scout
      - academic-architect

  profile-scanner:
    build:
      context: ./profile_scanner
      dockerfile: Dockerfile
    ports:
      - "8001:8080"
    env_file:
      - .env
    environment:
      - USE_FIRESTORE=${USE_FIRESTORE:-false}
      - FIRESTORE_DATABASE=${FIRESTORE_DATABASE:-(default)}
      - HOLLAND_COLLECTION_NAME=${HOLLAND_COLLECTION_NAME:-profile_scanner_holland_assessments}
      - ASSESSMENTS_COLLECTION_NAME=${ASSESSMENTS_COLLECTION_NAME:-profile_scanner_assessments}
      - CV_STORAGE_BUCKET=${CV_STORAGE_BUCKET}
      - CV_DOCUMENTS_COLLECTION=${CV_DOCUMENTS_COLLECTION:-profile_scanner_cv_documents}
      - PROFILE_SCANNER_CV_EXTRACTIONS_COLLECTION=${PROFILE_SCANNER_CV_EXTRACTIONS_COLLECTION:-profile_scanner_cv_extractions}
      - PROFILE_SCANNER_PROFILES_COLLECTION=${PROFILE_SCANNER_PROFILES_COLLECTION:-profile_scanner_profiles}
      - PROFILE_SCANNER_PROFILE_VERSIONS_COLLECTION=${PROFILE_SCANNER_PROFILE_VERSIONS_COLLECTION:-profile_scanner_profile_versions}
      - PROFILE_SCANNER_ALIGNMENT_COLLECTION=${PROFILE_SCANNER_ALIGNMENT_COLLECTION:-profile_scanner_alignment_results}
      - CV_MAX_FILE_SIZE_BYTES=${CV_MAX_FILE_SIZE_BYTES:-10485760}
      - HOLLAND_RESULTS_PATH=${HOLLAND_RESULTS_PATH:-/app/holland_results_db.json}
      - ASSESSMENTS_RESULTS_PATH=${ASSESSMENTS_RESULTS_PATH:-/app/assessment_results_db.json}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-z-mentorai}
      - DOCUMENT_AI_LOCATION=${DOCUMENT_AI_LOCATION:-us}
      - DOCUMENT_AI_PROCESSOR_ID=${DOCUMENT_AI_PROCESSOR_ID}
      - DOCUMENT_AI_PROCESSOR_NAME=${DOCUMENT_AI_PROCESSOR_NAME}
      - USE_VERTEX_AI=${USE_VERTEX_AI:-false}
      - VERTEX_AI_LOCATION=${VERTEX_AI_LOCATION:-asia-southeast1}
      - PROFILE_AI_EXTRACTION_ENABLED=${PROFILE_AI_EXTRACTION_ENABLED:-false}
      - PROFILE_AI_MODEL_NAME=${PROFILE_AI_MODEL_NAME:-gemini-2.5-flash}
      - DYNAMIC_BENCHMARK_ENABLED=${DYNAMIC_BENCHMARK_ENABLED:-false}
      - BENCHMARK_SNAPSHOTS_COLLECTION=${BENCHMARK_SNAPSHOTS_COLLECTION:-profile_scanner_benchmark_snapshots}
      - BENCHMARK_CACHE_COLLECTION=${BENCHMARK_CACHE_COLLECTION:-profile_scanner_benchmark_cache}
      - BENCHMARK_JOB_FACTS_COLLECTION=${BENCHMARK_JOB_FACTS_COLLECTION:-trend_job_facts_v2}
      - BENCHMARK_EMBEDDING_COLLECTION=${BENCHMARK_EMBEDDING_COLLECTION:-job_mapping_embedding}
      - BENCHMARK_EMBEDDING_MODEL=${BENCHMARK_EMBEDDING_MODEL:-text-multilingual-embedding-002}
      - BENCHMARK_EMBEDDING_LOCATION=${BENCHMARK_EMBEDDING_LOCATION:-us-central1}
      - BENCHMARK_MARKET_WINDOW_DAYS=${BENCHMARK_MARKET_WINDOW_DAYS:-365}
      - BENCHMARK_CACHE_DAYS=${BENCHMARK_CACHE_DAYS:-7}
      - BENCHMARK_DEFAULT_LOCATION=${BENCHMARK_DEFAULT_LOCATION:-vietnam}
    volumes:
      - ${GCLOUD_CONFIG_DIR:-./.gcloud}:/root/.config/gcloud:ro

  market-scout:
    build:
      context: ..
      dockerfile: backend/market_scout/Dockerfile
    ports:
      - "8002:8080"

  academic-architect:
    build:
      context: ./academic_architect
      dockerfile: Dockerfile
    ports:
      - "8003:8080"
    env_file:
      - .env
    environment:
      - USE_FIRESTORE=${USE_FIRESTORE:-false}
      - USE_VERTEX_AI=${USE_VERTEX_AI:-false}
      - FIRESTORE_DATABASE=${FIRESTORE_DATABASE:-(default)}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-z-mentorai}
    volumes:
      - ${GCLOUD_CONFIG_DIR:-./.gcloud}:/root/.config/gcloud:ro

