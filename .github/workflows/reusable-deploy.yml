name: Deploy Service to Google Cloud Run

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      build_context:
        required: true
        type: string
      dockerfile_path:
        required: false
        type: string
        default: ''
      env_vars:
        required: false
        type: string
        default: ''

env:
  PROJECT_ID: z-mentorai
  REGION: asia-southeast1
  REPOSITORY: z-mentor-repo

jobs:
  deploy:
    name: Build & Deploy ${{ inputs.service_name }}
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout repository
    - name: Checkout Code
      uses: actions/checkout@v3

    # 2. Authenticate with Google Cloud
    - name: Authenticate to GCP
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    # 3. Set up Google Cloud SDK
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1

    # 4. Configure Docker authentication
    - name: Docker Auth Config
      run: |
        gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

    # 5. Build and Push Image
    - name: Build & Push Image
      run: |
        if [ -n "${{ inputs.dockerfile_path }}" ]; then
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ inputs.service_name }}:latest -f ${{ inputs.dockerfile_path }} ${{ inputs.build_context }}
        else
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ inputs.service_name }}:latest ${{ inputs.build_context }}
        fi
        docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ inputs.service_name }}:latest

    # 6. Deploy to Cloud Run
    - name: Deploy to Cloud Run
      run: |
        if [ -n "${{ inputs.env_vars }}" ]; then
          gcloud run deploy ${{ inputs.service_name }} --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ inputs.service_name }}:latest --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }} --set-env-vars="${{ inputs.env_vars }}" --quiet
        else
          gcloud run deploy ${{ inputs.service_name }} --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ inputs.service_name }}:latest --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }} --quiet
        fi
